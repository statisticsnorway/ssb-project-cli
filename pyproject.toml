[project]
name = "ssb-project-cli"
version = "1.8.0"
requires-python = ">=3.10"
description = "SSB Project CLI"
license = "MIT"
classifiers = ["Development Status :: 4 - Beta"]
readme = "README.md"
authors = [{ name = "Statistics Norway", email = "stat-dev@ssb.no" }]
dependencies = [
    'typer==0.27.2',
    'click<8.6',
    'gitpython (>=3.1.59)',
    'pygithub (>=1.55)',
    'cruft (>=2.11.1)',
    'rich (>=12.5.1)',
    'requests (>=2.33.0)',
    'questionary (>=1.10.0)',
    'psutil (>=5.9.4)',
    'kvakk-git-tools (>=2.6.1)',
    'poetry (>=2.0)',
    'jupyter-client (>=8.3.1)',
    'ipykernel (>=6.25.2)',      # Run as a module, not imported in code
    'tomli (>=2.0.1)',
]

[project.urls]
homepage = "https://github.com/statisticsnorway/ssb-project-cli"
repository = "https://github.com/statisticsnorway/ssb-project-cli"
documentation = "https://ssb-project-cli.readthedocs.io"
Changelog = "https://github.com/statisticsnorway/ssb-project-cli/releases"

[project.scripts]
ssb-project = "ssb_project_cli.__main__:main"

[dependency-groups]
dev = [
    "bandit>=1.7.9",
    "black>=26.3.1",
    "build>=0.8.0",
    "coverage[toml]>=6.2",
    "cryptography>=50.0.0",
    "darglint>=1.8.1",
    "deptry>=0.23.1,<0.26",
    "flake8>=4.0.1",
    "flake8-bandit>=2.1.2",
    "flake8-bugbear>=21.9.2",
    "flake8-docstrings>=1.6.0",
    "flake8-rst-docstrings>=0.2.5",
    "idna>=3.15",
    "isort>=5.10.1",
    "jinja2>=3.1.4",
    "mock>=4.0.3",
    "mypy>=0.930",
    "nox>=2025.02.09",
    "pep8-naming>=0.12.1",
    "pre-commit>=2.16.0",
    "pre-commit-hooks>=4.1.0",
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pyupgrade>=2.29.1",
    "tomli-w>=1.0.0",
    "typeguard>=2.13.3",
    "types-psutil>=5.9.5.12",
    "types-requests>=2.28.11.17",
    "types-toml>=0.10.8",
    "types-urllib3>=1.26.25.10",
    "xdoctest[colors]>=0.15.10",
]
docs = [
    "furo>=2021.11.12",
    "jinja2>=3.1.2",
    "mkdocs>=1.4.0",
    "mkdocs-click>=0.8.0",
    "mkdocs-gen-files>=0.4.0",
    "mkdocs-literate-nav>=0.5.0",
    "mkdocs-material>=9.7.7",
    "mkdocs-section-index>=0.3.4",
    "mkdocs-typer>=0.0.3",
    "mkdocstrings",
    "mkdocstrings-python>=1.3.0",
    "mock>=4.0.3",
    "myst-parser>=0.16.1",
    "sphinx>=4.3.2",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-click>=3.0.2",
    "xdoctest[colors]>=0.15.10",
]

[tool.uv]
required-version = ">=0.12,<0.13"

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["ssb_project_cli", "tests"]
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.isort]
profile = "black"
force_single_line = true

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = ["attr.*", "cruft.*", "tomli_w.*"]
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
