version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: "/.github/workflows"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/docs"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docs-dependencies:
        patterns:
          - "*"
