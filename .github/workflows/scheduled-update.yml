name: Update dependencies

on:
  schedule:
    # 07:00 on Fridays
    - cron: "0 7 * * Fri"
  # Allow manual triggering
  workflow_dispatch:

jobs:
  autoupdate_dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a
        with:
          app_id: ${{ secrets.DEPENDENCY_UPDATER_PYTHON_ID }}
          private_key: ${{ secrets.DEPENDENCY_UPDATER_PYTHON_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Run autoupdate
        shell: bash
        env:
          update_command: "uv lock --upgrade"
          default_branch: ${{ github.event.repository.default_branch }}
          update_path: "" # Set to run in a specific path with run update_command
          on_changes_command: "uv sync --frozen --all-groups" # Command to run when changes are detected
        run: |
          .github/workflows/update-dependencies.sh \
          ${{ steps.generate_token.outputs.token }} \
          "${update_command}" \
          "${default_branch}" \
          "${update_path}" \
          "${on_changes_command}"
